<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>{{website.title}}</title>
		<meta name="description" content="{{website.description}}">
		<meta property="og:title" content="{{website.title}}">
		<meta property="og:description" content="{{website.description}}">
		<meta property="og:type" content="website">
		<link rel="alternate" type="application/atom+xml" href="feed.atom">
		<link rel="alternate" type="application/feed+json" href="feed.json">
		<link rel="alternate" type="application/rss+xml" href="feed.rss">
		<link rel="stylesheet" href="styles.css">
	</head>
	<body>
		<nav style="display:flex; gap:12px; margin-bottom:16px;">
			<a href="index.html">{{website.title}}</a>
			<span style="opacity:60%">/</span>
			<a href="docs.html">Docs</a>
		</nav>
		<section style="text-align: center">
			<h1>{{website.title}}</h1>
			<p style="opacity: 60%">{{website.description}}</p>
		</section>

		<hr>

		<section>
			<h2>Documentation</h2>

			{{#posts}}

			<article class="post">
				<h3 class="title">
					<a href="{{url}}">{{title}}</a>
				</h3>

				<div class="post-info">
					{{#created}}
					<p class="creation-date">
						{{day}}/{{month}}/{{year}} {{hour}}:{{minute}}
					</p>
					{{/created}}
				</div>
			</article>

			{{/posts}}
		</section>

		<footer style="margin-top: 32px; opacity: 60%; font-size: 0.9em;">
			<p>
				Built with
				<a href="https://makko.starlightnet.work">Makko</a>.
			</p>
			<div style="display:flex; gap:8px; margin-top:8px;">
				<a class="button" href="https://makko.starlightnet.work">
					<img
						alt="Made with Makko"
						src="https://makko.starlightnet.work/media/madebymakko.webp"
						width="88"
						height="31"
				></a>

				<a class="button" href="https://makko.starlightnet.work">
					<img
						alt="Makko site"
						src="https://makko.starlightnet.work/media/makkosite.webp"
						width="88"
						height="31"
				></a>
			</div>
		</footer>
	</body>
</html>
